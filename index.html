<!DOCTYPE html>
<html>
<head>
  <title>Chat Controls Survival</title>

  <style>
    body {
      margin: 0;
      background: #0a0a0f;
      color: white;
      font-family: Arial;
    }

    #topBar {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 20px;
    }

    #container {
      display: flex;
      height: 90vh;
    }

    #leftPanel, #rightPanel {
      width: 250px;
      background: #111;
      padding: 10px;
      overflow-y: auto;
    }

    #leftPanel { border-right: 2px solid purple; }
    #rightPanel { border-left: 2px solid purple; }

    #arena {
      flex: 1;
      position: relative;
      background: radial-gradient(circle, #111 40%, #000 100%);
    }

    .enemy {
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
      position: absolute;
    }

    #player {
      width: 25px;
      height: 25px;
      background: cyan;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .event {
      font-size: 14px;
      margin: 5px 0;
      color: #0f0;
    }

    #bottomBar {
      height: 20px;
      background: linear-gradient(to right, green 50%, red 50%);
    }

    #popup {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      color: yellow;
      display: none;
    }
  </style>
</head>

<body>

<div id="topBar">
  Wave: <span id="wave">1</span> | Score: <span id="score">0</span>
</div>

<div id="container">

  <div id="leftPanel">
    <h3>Live Events</h3>
    <div id="events"></div>
  </div>

  <div id="arena">
    <div id="player"></div>
    <div id="popup"></div>
  </div>

  <div id="rightPanel">
    <h3>Gift Actions</h3>
    <p>🌹 Rose → Enemy</p>
    <p>🚀 Galaxy → Power Mode</p>
    <p>🦁 Lion → Boss</p>
  </div>

</div>

<div id="bottomBar"></div>

<script src="game.js"></script>
</body>
</html>
