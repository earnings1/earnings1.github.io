<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO ARENA - TikTok Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { font-family: 'Press Start 2P', sans-serif; }
        canvas { background: #f0f0f0; image-rendering: pixelated; border: 6px solid #000; }
    </style>
</head>
<body class="bg-black text-white overflow-hidden">
    <div class="flex h-screen">
        <!-- Game Area -->
        <div class="flex-1 flex flex-col items-center justify-center bg-gradient-to-b from-gray-800 to-black">
            <h1 class="text-5xl font-bold text-yellow-400 mb-2 tracking-widest">DINO ARENA</h1>
            <p class="text-emerald-400 mb-6">SPACE = JUMP • Send ROSE = Fireball Attack!</p>
            
            <canvas id="gameCanvas" width="900" height="320" class="shadow-2xl"></canvas>
            
            <div class="mt-6 flex gap-6">
                <button onclick="simulateRose()" 
                        class="bg-gradient-to-r from-pink-500 to-rose-600 px-10 py-4 rounded-2xl font-bold text-lg flex items-center gap-3 hover:scale-105 transition">
                    🌹 SEND ROSE (Fireball)
                </button>
                <div class="text-sm text-gray-400 pt-4">
                    Press <span class="text-white font-bold">SPACE</span> to Jump
                </div>
            </div>
        </div>

        <!-- Live Panel -->
        <div class="w-96 bg-zinc-900 border-l border-zinc-700 p-6 flex flex-col">
            <div class="mb-8">
                <h3 class="text-2xl font-bold mb-2">SCORE</h3>
                <div id="score" class="text-7xl font-bold text-yellow-400">00000</div>
            </div>
            
            <div>
                <h3 class="text-lg font-bold mb-4">🌹 GIFT LOG</h3>
                <div id="gift-log" class="space-y-3 text-sm overflow-y-auto flex-1"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let dino = { x: 80, y: 220, vy: 0, width: 48, height: 55, jumping: false };
        let gravity = 0.92;
        let jumpPower = -21;
        let score = 0;
        let gameSpeed = 7;
        let gameOver = false;
        let obstacles = [];
        let fireballs = [];
        let groundY = 245;
        let frame = 0;

        function resetGame() {
            gameOver = false;
            score = 0;
            frame = 0;
            obstacles = [];
            fireballs = [];
            dino.y = 220;
            dino.vy = 0;
            dino.jumping = false;
            document.getElementById('score').textContent = "00000";
            addGiftLog("🔄 GAME RESET! Press SPACE to jump");
        }

        function drawDino() {
            ctx.fillStyle = '#111';
            ctx.fillRect(dino.x + 10, dino.y + 10, 38, 32);           // body
            ctx.fillRect(dino.x + 40, dino.y + 5, 25, 22);            // head
            ctx.fillRect(dino.x + 15, dino.y + 38, 10, 20);           // leg1
            ctx.fillRect(dino.x + 30, dino.y + 38, 10, 20);           // leg2
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(dino.x + 55, dino.y + 12, 9, 9);             // eye
        }

        function drawGround() {
            ctx.fillStyle = '#333';
            ctx.fillRect(0, groundY + 35, canvas.width, 100);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 4;
            for (let i = (frame * -gameSpeed) % 60; i < canvas.width; i += 60) {
                ctx.beginPath();
                ctx.moveTo(i, groundY + 30);
                ctx.lineTo(i + 35, groundY + 30);
                ctx.stroke();
            }
        }

        function createObstacle() {
            obstacles.push({ x: canvas.width, width: 32, height: 55 });
        }

        function createFireball() {
            fireballs.push({ 
                x: canvas.width + 40, 
                y: dino.y + 15 + Math.random() * 30, 
                speed: 12 
            });
            addGiftLog("🌹 ROSE → FIREBALL INCOMING!");
        }

        function update() {
            if (gameOver) return;
            frame++;
            score += 3;
            document.getElementById('score').textContent = String(Math.floor(score)).padStart(5, '0');

            dino.vy += gravity;
            dino.y += dino.vy;

            if (dino.y >= groundY - dino.height) {
                dino.y = groundY - dino.height;
                dino.vy = 0;
                dino.jumping = false;
            }

            obstacles.forEach(o => o.x -= gameSpeed);
            fireballs.forEach(f => f.x -= f.speed);

            obstacles = obstacles.filter(o => o.x > -50);
            fireballs = fireballs.filter(f => f.x > -50);

            if (frame % 48 === 0) createObstacle();

            // Collisions
            for (let o of obstacles) {
                if (dino.x + 45 > o.x && dino.x < o.x + o.width && 
                    dino.y + dino.height - 10 > groundY - o.height) gameOver = true;
            }
            for (let f of fireballs) {
                if (Math.abs(dino.x + 40 - f.x) < 35 && Math.abs(dino.y + 20 - f.y) < 40) {
                    gameOver = true;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGround();

            ctx.fillStyle = '#166534';
            obstacles.forEach(o => ctx.fillRect(o.x, groundY - o.height, o.width, o.height));

            ctx.fillStyle = '#f97316';
            fireballs.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, 16, 0, Math.PI*2);
                ctx.fill();
            });

            drawDino();

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '32px Press Start 2P';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, 140);
                ctx.font = '18px Press Start 2P';
                ctx.fillText('Press SPACE to reset', canvas.width/2, 190);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function jump() {
            if (gameOver) {
                resetGame();
            } else if (!dino.jumping) {
                dino.vy = jumpPower;
                dino.jumping = true;
            }
        }

        function simulateRose() {
            if (!gameOver) createFireball();
        }

        function addGiftLog(text) {
            const log = document.getElementById('gift-log');
            const div = document.createElement('div');
            div.className = "bg-zinc-800 p-4 rounded-2xl border-l-4 border-pink-500";
            div.textContent = text;
            log.appendChild(div);
            if (log.children.length > 8) log.removeChild(log.firstChild);
        }

        // ================== SPACE BAR (Fixed & Reliable) ==================
        document.addEventListener('keydown', e => {
            if (e.key === " " || e.key === "Spacebar") {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

        window.onload = () => {
            obstacles.push({ x: 550, width: 32, height: 55 });
            gameLoop();
        };
    </script>
</body>
</html>
