<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO ARENA - TikTok Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { font-family: 'Press Start 2P', sans-serif; }
        canvas { background: #f0f0f0; image-rendering: pixelated; }
    </style>
</head>
<body class="bg-black text-white overflow-hidden">
    <div class="flex h-screen">
        <div class="flex-1 flex flex-col items-center justify-center bg-[#535353]">
            <div class="mb-4 text-center">
                <h1 class="text-5xl font-bold text-yellow-400 tracking-wider">DINO ARENA</h1>
                <p class="text-emerald-400">Send ROSE → Fireball Attack!</p>
            </div>
            
            <canvas id="gameCanvas" width="800" height="300" class="border-4 border-white shadow-2xl"></canvas>
            
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-400 mb-2">PRESS SPACE TO JUMP</p>
                <button onclick="simulateRose()" 
                        class="bg-pink-600 hover:bg-pink-700 px-8 py-4 rounded-xl font-bold text-lg flex items-center gap-3 mx-auto">
                    🌹 SEND ROSE (Fireball)
                </button>
            </div>
        </div>

        <div class="w-80 bg-zinc-900 border-l border-zinc-700 p-6 overflow-auto">
            <h3 class="text-xl font-bold mb-4">📊 SCORE</h3>
            <div id="score" class="text-6xl font-bold text-yellow-400 mb-8">00000</div>
            
            <h3 class="text-lg font-bold mb-3">Gift Log</h3>
            <div id="gift-log" class="space-y-3 text-sm"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let dino = { x: 80, y: 200, vy: 0, width: 44, height: 50, jumping: false };
        let gravity = 0.85;
        let jumpPower = -19;
        let score = 0;
        let gameSpeed = 6;
        let gameOver = false;
        let obstacles = [];
        let fireballs = [];
        let groundY = 220;
        let frame = 0;

        function drawDino() {
            ctx.fillStyle = '#111';
            // Body
            ctx.fillRect(dino.x + 8, dino.y + 8, 32, 28);
            // Head
            ctx.fillRect(dino.x + 35, dino.y - 2, 22, 22);
            // Legs
            ctx.fillRect(dino.x + 12, dino.y + 32, 9, 18);
            ctx.fillRect(dino.x + 26, dino.y + 32, 9, 18);
            // Eye
            ctx.fillStyle = '#fff';
            ctx.fillRect(dino.x + 48, dino.y + 6, 8, 8);
        }

        function drawGround() {
            ctx.fillStyle = '#444';
            ctx.fillRect(0, groundY + 35, canvas.width, 80);
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 3;
            for (let i = (frame * -gameSpeed) % 50; i < canvas.width + 50; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, groundY + 30);
                ctx.lineTo(i + 30, groundY + 30);
                ctx.stroke();
            }
        }

        function createObstacle() {
            obstacles.push({ x: canvas.width, width: 28, height: 50 });
        }

        function createFireball() {
            fireballs.push({ x: canvas.width + 30, y: dino.y + 15, speed: 11 });
            addGiftLog("🌹 ROSE → Fireball launched!");
        }

        function update() {
            if (gameOver) return;
            frame++;
            score += 2;
            document.getElementById('score').textContent = String(Math.floor(score)).padStart(5, '0');

            // Dino jump physics
            dino.vy += gravity;
            dino.y += dino.vy;

            if (dino.y >= groundY - dino.height) {
                dino.y = groundY - dino.height;
                dino.vy = 0;
                dino.jumping = false;
            }

            // Move obstacles & fireballs
            obstacles.forEach(o => o.x -= gameSpeed);
            fireballs.forEach(f => f.x -= f.speed);

            // Remove offscreen
            obstacles = obstacles.filter(o => o.x > -50);
            fireballs = fireballs.filter(f => f.x > -50);

            // Spawn obstacles
            if (frame % 55 === 0) createObstacle();

            // Collision
            for (let o of obstacles) {
                if (dino.x + dino.width > o.x && dino.x < o.x + o.width &&
                    dino.y + dino.height > groundY - o.height) {
                    gameOver = true;
                }
            }
            for (let f of fireballs) {
                if (dino.x + dino.width > f.x - 15 && dino.x < f.x + 25 &&
                    Math.abs(dino.y - f.y) < 35) {
                    gameOver = true;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGround();

            // Cacti
            ctx.fillStyle = '#166534';
            obstacles.forEach(o => ctx.fillRect(o.x, groundY - o.height, o.width, o.height));

            // Fireballs
            ctx.fillStyle = '#f97316';
            fireballs.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, 14, 0, Math.PI*2);
                ctx.fill();
            });

            drawDino();

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 80, canvas.width, 140);
                ctx.fillStyle = '#fff';
                ctx.font = '28px Press Start 2P';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, 150);
                ctx.font = '16px Press Start 2P';
                ctx.fillText('Send Rose to Attack', canvas.width/2, 190);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function jump() {
            if (!dino.jumping && !gameOver) {
                dino.vy = jumpPower;
                dino.jumping = true;
            }
        }

        function simulateRose() {
            if (!gameOver) createFireball();
        }

        function addGiftLog(text) {
            const log = document.getElementById('gift-log');
            const div = document.createElement('div');
            div.className = "bg-zinc-800 p-3 rounded-xl";
            div.textContent = text;
            log.appendChild(div);
            if (log.children.length > 7) log.removeChild(log.firstChild);
        }

        // ================== SPACE BAR JUMP ==================
        document.addEventListener('keydown', (e) => {
            if (e.key === " " || e.key === "Spacebar") {
                e.preventDefault();   // Prevent scrolling
                jump();
            }
        });

        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

        window.onload = () => {
            obstacles.push({ x: 500, width: 28, height: 50 });
            gameLoop();
        };
    </script>
</body>
</html>
